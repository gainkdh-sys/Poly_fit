name: Auto Update Candidates Data

on:
  schedule:
    # 매주 월요일 새벽 2시에 실행
    - cron: '0 2 * * 1'
  
  # 수동으로도 실행 가능
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Run update script
        run: python scripts/update_candidates.py
      
      - name: Commit and Push changes
        run: |
          git config --global user.name "Poly Fit Bot"
          git config --global user.email "bot@polyfit.dev"
          git add data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto: Update candidates data from pipeline"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi
